aid: bitwise-investments
name: Bitwise Investments
description: 'Bitwise Asset Management is one of the world''s largest crypto asset managers, founded
  in 2017 and managing roughly $9 billion in client assets across more than 70 investment products
  — including crypto index funds, ETFs (such as the Bitwise 10 Crypto Index ETF, BITW, and the Bitwise
  Bitcoin ETF, BITB), separately managed accounts, private funds, hedge fund strategies, and staking.
  Bitwise serves thousands of financial advisors, RIAs, family offices, and institutional investors,
  bridging crypto and traditional finance. The Bitwise API (developers.bitwiseinvestments.com) exposes
  Bitwise index, ETF, and fund data — crypto asset prices, index values, and methodologies — to partners;
  access uses an Authorization header with API keys issued on request (api@bitwiseinvestments.com).'
